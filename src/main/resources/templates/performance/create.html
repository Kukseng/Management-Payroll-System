<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Review</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css?v=1.1}">
</head>
<body class="bg-light"><div class="container py-5" style="max-width: 900px;">
    <div class="card shadow-sm"><div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 mb-0">Create Performance Review</h1><a class="btn btn-outline-primary btn-sm" th:href="@{/hr/dashboard}">Back</a></div>
        <div id="msg"></div>
        <form id="reviewForm" class="row g-3">
            <div class="col-md-6"><label class="form-label">Employee ID</label><input class="form-control" id="employeeId" required></div>
            <div class="col-md-6"><label class="form-label">KPI Score</label><input class="form-control" type="number" step="0.1" id="kpiScore" required></div>
            <div class="col-12"><label class="form-label">Feedback</label><textarea class="form-control" id="feedback" rows="5" required></textarea></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Save Review</button></div>
        </form>
    </div></div>
</div>
<script>
document.getElementById('reviewForm').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch('/api/v1/performance', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      employeeId: document.getElementById('employeeId').value,
      feedback: document.getElementById('feedback').value,
      kpiScore: Number(document.getElementById('kpiScore').value)
    })
  });
  const msg = document.getElementById('msg');
  msg.innerHTML = res.ok ? '<div class="alert alert-success">Performance review saved.</div>' : `<div class="alert alert-danger">${await res.text()}</div>`;
});
</script>
</body>
</html>
