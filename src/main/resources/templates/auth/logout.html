<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; font-family: Arial, sans-serif; }
        .card { max-width: 520px; width: 100%; }
    </style>
</head>
<body>
    <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
            <h1 class="h3 mb-3">You have been logged out</h1>
            <p class="text-muted mb-4">Your session is closed. You can log in again anytime.</p>
            <a class="btn btn-primary" th:href="@{/login}">Back to Login</a>
        </div>
    </div>
</body>
</html>
