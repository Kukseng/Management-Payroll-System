<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css?v=1.1}">
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 720px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Change Password</h1>
            <div id="msg"></div>
            <form id="changePasswordForm">
                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input class="form-control" type="password" id="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input class="form-control" type="password" id="newPassword" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input class="form-control" type="password" id="confirmPassword" required>
                </div>
                <button class="btn btn-primary" type="submit">Update Password</button>
                <a class="btn btn-link" th:href="@{/login}">Back</a>
            </form>
        </div>
    </div>
</div>
<script>
document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const msg = document.getElementById('msg');

    if (newPassword !== confirmPassword) {
        msg.innerHTML = '<div class="alert alert-danger">New passwords do not match.</div>';
        return;
    }

    const res = await fetch('/api/v1/auth/change-password', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ currentPassword, newPassword })
    });

    if (res.ok) {
        msg.innerHTML = '<div class="alert alert-success">Password updated successfully.</div>';
    } else {
        const text = await res.text();
        msg.innerHTML = `<div class="alert alert-danger">${text || 'Failed to update password'}</div>`;
    }
});
</script>
</body>
</html>
