<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Attendance</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css?v=1.1}">
</head>
<body class="bg-light"><div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 mb-0">My Attendance</h1><a class="btn btn-outline-primary btn-sm" th:href="@{/employee/dashboard}">Back</a></div>
    <div class="card shadow-sm"><div class="card-body">
        <table class="table table-striped"><thead><tr><th>ID</th><th>Department</th><th>Clock In</th><th>Clock Out</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table>
    </div></div>
</div>
<script>
fetch('/api/v1/attendance/my', { headers: { 'Accept': 'application/json' } })
.then(r => r.json())
.then(data => {
  const rows = document.getElementById('rows');
  rows.innerHTML = data.map(a => `<tr><td>${a.attendanceId||''}</td><td>${a.departmentName||a.departmentId||''}</td><td>${a.clockIn||''}</td><td>${a.clockOut||''}</td><td>${a.statusName||a.status||''}</td></tr>`).join('') || '<tr><td colspan="5">No records</td></tr>';
})
.catch(() => {
  document.getElementById('rows').innerHTML = '<tr><td colspan="5">Failed to load</td></tr>';
});
</script>
</body>
</html>
