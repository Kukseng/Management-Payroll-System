<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HR Attendance Report</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css?v=1.1}">
</head>
<body class="bg-light"><div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 mb-0">HR Attendance Report</h1><a class="btn btn-outline-primary btn-sm" th:href="@{/hr/dashboard}">Back</a></div>
    <div class="card shadow-sm mb-3"><div class="card-body row g-3 align-items-end">
        <div class="col-md-4"><label class="form-label">Department ID</label><input class="form-control" id="departmentId" placeholder="HR or IT"></div>
        <div class="col-md-2"><label class="form-label">Month</label><input class="form-control" id="month" type="number" min="1" max="12" value="4"></div>
        <div class="col-md-2"><label class="form-label">Year</label><input class="form-control" id="year" type="number" value="2026"></div>
        <div class="col-md-4"><button class="btn btn-primary" onclick="loadReport()">Load Report</button></div>
    </div></div>
    <div class="card shadow-sm"><div class="card-body"><table class="table table-striped"><thead><tr><th>ID</th><th>Employee</th><th>Clock In</th><th>Clock Out</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5">Use filters to load data</td></tr></tbody></table></div></div>
</div>
<script>
function buildAuthHeaders(){
  return {'Accept': 'application/json'};
}

async function loadReport(){
  const rows = document.getElementById('rows');
  const departmentId = document.getElementById('departmentId').value.trim();
  const endpoint = departmentId
    ? `/api/v1/attendance/hr?departmentId=${encodeURIComponent(departmentId)}&month=${document.getElementById('month').value}&year=${document.getElementById('year').value}`
    : '/api/v1/attendance/employees?isActive=true';

  try {
    const res = await fetch(endpoint, { headers: buildAuthHeaders() });
    if (!res.ok) {
      const err = await res.text();
      rows.innerHTML = `<tr><td colspan="5">${err || 'Failed to load records'}</td></tr>`;
      return;
    }
    const data = await res.json();
    rows.innerHTML = data.map(a => `<tr><td>${a.attendanceId||''}</td><td>${a.employeeId||''}</td><td>${a.clockIn||''}</td><td>${a.clockOut||''}</td><td>${a.statusName||a.status||''}</td></tr>`).join('') || '<tr><td colspan="5">No records</td></tr>';
  } catch (_) {
    rows.innerHTML = '<tr><td colspan="5">Failed to load records</td></tr>';
  }
}

document.addEventListener('DOMContentLoaded', loadReport);
</script>
</body>
</html>
