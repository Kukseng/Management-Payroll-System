<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edit Employee</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 900px;">
	<div class="card shadow-sm">
		<div class="card-body p-4">
			<div class="d-flex justify-content-between align-items-center mb-3">
				<h1 class="h4 mb-0">Edit Employee</h1>
				<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/employees}">Back</a>
			</div>
			<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
			<div id="msg"></div>
			<form id="employeeEditForm" class="row g-3" th:if="${employee != null}">
				<div class="col-md-6"><label class="form-label">First Name</label><input class="form-control" id="firstName" th:value="${employee.firstName}" required></div>
				<div class="col-md-6"><label class="form-label">Last Name</label><input class="form-control" id="lastName" th:value="${employee.lastName}" required></div>
				<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" id="email" th:value="${employee.email}" required></div>
				<div class="col-md-6"><label class="form-label">Date of Birth</label><input class="form-control" type="date" id="dateOfBirth" th:value="${employee.dateOfBirth}"></div>
				<div class="col-12"><button class="btn btn-primary" type="submit">Save Changes</button></div>
			</form>
			<div th:if="${employee == null}" class="text-muted">Employee data is unavailable.</div>
		</div>
	</div>
</div>
<script th:inline="javascript">
const employeeId = /*[[${employee.employeeId}]]*/ '';
document.getElementById('employeeEditForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    firstName: document.getElementById('firstName').value,
    lastName: document.getElementById('lastName').value,
    email: document.getElementById('email').value,
    dateOfBirth: document.getElementById('dateOfBirth').value || null
  };
  const res = await fetch(`/api/v1/employee/${employeeId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  document.getElementById('msg').innerHTML = res.ok ? '<div class="alert alert-success">Employee updated successfully.</div>' : `<div class="alert alert-danger">${await res.text()}</div>`;
});
</script>
</body>
</html>
