<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - HR Management System</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.0/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css?v=1.1}">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 900px;">
    <!-- Profile Card -->
    <div class="card shadow-sm border mb-4">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0"><i class="fas fa-user-circle"></i> My Profile</h1>
                <a class="btn btn-outline-primary btn-sm" th:href="@{/employee/dashboard}">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
            <div id="profileMsg"></div>
            <div class="row g-3" id="profileContent">
                <div class="col-md-6"><label class="form-label fw-semibold">Employee ID</label><div class="form-control bg-white" id="employeeId">Loading...</div></div>
                <div class="col-md-6"><label class="form-label fw-semibold">Username</label><div class="form-control bg-white" id="username">Loading...</div></div>
                <div class="col-md-6"><label class="form-label fw-semibold">Email</label><div class="form-control bg-white" id="email">Loading...</div></div>
                <div class="col-md-6"><label class="form-label fw-semibold">Role</label><div class="form-control bg-white" id="role">Loading...</div></div>
            </div>
        </div>
    </div>

    <!-- Document Vault Card -->
    <div class="card shadow-sm border">
        <div class="card-body p-4">
            <h5 class="card-title fw-bold text-primary mb-3"><i class="fas fa-folder-open"></i> Document Vault</h5>
            <p class="text-muted small">Upload and manage secure HR documents, contracts, and identifications.</p>
            
            <form id="docUploadForm" class="row g-3 mb-4 align-items-end">
                <div class="col-md-9">
                    <label class="form-label fw-semibold">Select File to Upload</label>
                    <input type="file" id="docFile" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-upload"></i> Upload</button>
                </div>
            </form>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Filename</th>
                            <th>Type</th>
                            <th>Upload Date</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="docRows">
                        <tr>
                            <td colspan="4" class="text-center text-muted">No documents uploaded.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let currentEmployeeId = null;

fetch('/api/v1/auth/me', { headers: { 'Accept': 'application/json' } })
  .then(r => r.ok ? r.json() : Promise.reject(r))
  .then(data => {
    document.getElementById('employeeId').textContent = data.employeeId || '-';
    document.getElementById('username').textContent = data.username || '-';
    document.getElementById('email').textContent = data.email || '-';
    document.getElementById('role').textContent = data.roleName || data.role || '-';
    
    currentEmployeeId = data.employeeId;
    loadDocuments();
  })
  .catch(() => {
    document.getElementById('profileMsg').innerHTML = '<div class="alert alert-danger">Unable to load profile. Please login again.</div>';
  });

async function loadDocuments() {
    if (!currentEmployeeId) return;
    try {
        const res = await fetch(`/api/v1/employee/${currentEmployeeId}/documents`, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error();
        const docs = await res.json();
        const tbody = document.getElementById('docRows');
        tbody.innerHTML = docs.map(d => `
            <tr>
                <td><strong>${d.filename}</strong></td>
                <td><span class="badge bg-light text-dark border">${d.fileType || 'binary'}</span></td>
                <td>${new Date(d.uploadDate).toLocaleString()}</td>
                <td class="text-end">
                    <a href="/api/v1/employee/${currentEmployeeId}/documents/${d.documentId}/download" class="btn btn-sm btn-outline-primary me-1">
                        <i class="fas fa-download"></i>
                    </a>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteDoc('${d.documentId}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="4" class="text-center text-muted">No documents uploaded.</td></tr>';
    } catch (err) {
        console.error(err);
    }
}

async function deleteDoc(docId) {
    if (!confirm('Are you sure you want to delete this document?')) return;
    try {
        const res = await fetch(`/api/v1/employee/${currentEmployeeId}/documents/${docId}`, {
            method: 'DELETE'
        });
        if (res.ok) {
            loadDocuments();
        } else {
            alert('Failed to delete document.');
        }
    } catch (err) {
        alert('Error: ' + err);
    }
}

document.getElementById('docUploadForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fileInput = document.getElementById('docFile');
    if (!fileInput.files[0] || !currentEmployeeId) return;
    
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    
    try {
        const res = await fetch(`/api/v1/employee/${currentEmployeeId}/documents`, {
            method: 'POST',
            body: formData
        });
        if (res.ok) {
            fileInput.value = '';
            loadDocuments();
        } else {
            const txt = await res.text();
            alert('Upload failed: ' + txt);
        }
    } catch (err) {
        alert('Upload error: ' + err);
    }
});
</script>
</body>
</html>
