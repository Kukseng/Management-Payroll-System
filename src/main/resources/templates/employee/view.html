<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 900px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0">My Profile</h1>
                <a class="btn btn-outline-primary btn-sm" th:href="@{/employee/dashboard}">Back</a>
            </div>
            <div id="profileMsg"></div>
            <div class="row g-3" id="profileContent">
                <div class="col-md-6"><label class="form-label">Employee ID</label><div class="form-control bg-white" id="employeeId">Loading...</div></div>
                <div class="col-md-6"><label class="form-label">Username</label><div class="form-control bg-white" id="username">Loading...</div></div>
                <div class="col-md-6"><label class="form-label">Email</label><div class="form-control bg-white" id="email">Loading...</div></div>
                <div class="col-md-6"><label class="form-label">Role</label><div class="form-control bg-white" id="role">Loading...</div></div>
            </div>
        </div>
    </div>
</div>
<script>
fetch('/api/v1/auth/me', { headers: { 'Accept': 'application/json' } })
  .then(r => r.ok ? r.json() : Promise.reject(r))
  .then(data => {
    document.getElementById('employeeId').textContent = data.employeeId || '-';
    document.getElementById('username').textContent = data.username || '-';
    document.getElementById('email').textContent = data.email || '-';
    document.getElementById('role').textContent = data.roleName || data.role || '-';
  })
  .catch(() => {
    document.getElementById('profileMsg').innerHTML = '<div class="alert alert-danger">Unable to load profile. Please login again.</div>';
  });
</script>
</body>
</html>
