<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Employee</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 900px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0">Create Employee</h1>
                <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/employees}">Back</a>
            </div>
            <div id="msg"></div>
            <form id="employeeForm" class="row g-3">
                <div class="col-md-6"><label class="form-label">First Name</label><input class="form-control" id="firstName" required></div>
                <div class="col-md-6"><label class="form-label">Last Name</label><input class="form-control" id="lastName" required></div>
                <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" id="email" required></div>
                <div class="col-md-6"><label class="form-label">Username</label><input class="form-control" id="username" required></div>
                <div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" id="password" required></div>
                <div class="col-md-6"><label class="form-label">Date of Birth</label><input class="form-control" type="date" id="dateOfBirth" required></div>
                <div class="col-md-4"><label class="form-label">Department ID</label><input class="form-control" id="departmentId" placeholder="IT or HR"></div>
                <div class="col-md-4"><label class="form-label">Role ID</label><input class="form-control" id="roleId" placeholder="Role UUID"></div>
                <div class="col-md-4"><label class="form-label">Employment Type</label><select class="form-select" id="employmentType"><option>FULL_TIME</option><option>PART_TIME</option><option>CONTRACTOR</option><option>INTERN</option></select></div>
                <div class="col-md-6"><label class="form-label">Base Salary</label><input class="form-control" type="number" step="0.01" id="baseSalary" value="3000"></div>
                <div class="col-12"><button class="btn btn-primary" type="submit">Create</button></div>
            </form>
        </div>
    </div>
</div>
<script>
document.getElementById('employeeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    firstName: document.getElementById('firstName').value,
    lastName: document.getElementById('lastName').value,
    email: document.getElementById('email').value,
    username: document.getElementById('username').value,
    password: document.getElementById('password').value,
    dateOfBirth: document.getElementById('dateOfBirth').value,
    departmentId: document.getElementById('departmentId').value || null,
    roleId: document.getElementById('roleId').value || null,
    employmentType: document.getElementById('employmentType').value,
    baseSalary: Number(document.getElementById('baseSalary').value)
  };
  const res = await fetch('/api/v1/employee', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  document.getElementById('msg').innerHTML = res.ok ? '<div class="alert alert-success">Employee created successfully.</div>' : `<div class="alert alert-danger">${await res.text()}</div>`;
});
</script>
</body>
</html>
