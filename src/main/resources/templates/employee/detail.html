<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Detail</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 900px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0">Employee Detail</h1>
                <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/employees}">Back</a>
            </div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${employee != null}" class="row g-3">
                <div class="col-md-6"><label class="form-label">Employee ID</label><div class="form-control bg-white" th:text="${employee.employeeId}"></div></div>
                <div class="col-md-6"><label class="form-label">Username</label><div class="form-control bg-white" th:text="${employee.username}"></div></div>
                <div class="col-md-6"><label class="form-label">Name</label><div class="form-control bg-white" th:text="${employee.firstName + ' ' + employee.lastName}"></div></div>
                <div class="col-md-6"><label class="form-label">Email</label><div class="form-control bg-white" th:text="${employee.email}"></div></div>
                <div class="col-md-6"><label class="form-label">Department</label><div class="form-control bg-white" th:text="${employee.departmentName}"></div></div>
                <div class="col-md-6"><label class="form-label">Role</label><div class="form-control bg-white" th:text="${employee.roleName}"></div></div>
                <div class="col-md-6"><label class="form-label">Employment Type</label><div class="form-control bg-white" th:text="${employee.employmentType}"></div></div>
                <div class="col-md-6"><label class="form-label">Active</label><div class="form-control bg-white" th:text="${employee.IsActive}"></div></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
