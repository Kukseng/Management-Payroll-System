<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Process Payroll</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
</head>
<body class="bg-light"><div class="container py-5" style="max-width: 900px;">
    <div class="card shadow-sm"><div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 mb-0">Process Payroll</h1><a class="btn btn-outline-primary btn-sm" th:href="@{/admin/payroll}">Back</a></div>
        <div id="msg"></div>
        <form id="payrollForm" class="row g-3">
            <div class="col-md-6"><label class="form-label">Employee ID</label><input class="form-control" id="employeeId" required></div>
            <div class="col-md-3"><label class="form-label">Month</label><input class="form-control" type="number" id="month" min="1" max="12" required></div>
            <div class="col-md-3"><label class="form-label">Year</label><input class="form-control" type="number" id="year" required></div>
            <div class="col-md-6"><label class="form-label">Deductions</label><input class="form-control" type="number" step="0.01" id="deductions" value="0"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Run Payroll</button></div>
        </form>
    </div></div>
</div>
<script>
document.getElementById('payrollForm').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch('/api/v1/payroll/process', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      employeeId: document.getElementById('employeeId').value,
      month: Number(document.getElementById('month').value),
      year: Number(document.getElementById('year').value),
      deductions: Number(document.getElementById('deductions').value)
    })
  });
  const msg = document.getElementById('msg');
  msg.innerHTML = res.ok ? '<div class="alert alert-success">Payroll processed.</div>' : `<div class="alert alert-danger">${await res.text()}</div>`;
});
</script>
</body>
</html>
