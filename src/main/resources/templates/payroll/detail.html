<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payroll Detail</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css?v=1.1}">
</head>
<body class="bg-light"><div class="container py-5" style="max-width: 900px;">
    <div class="card shadow-sm"><div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 mb-0">Payroll Detail</h1><a class="btn btn-outline-primary btn-sm" href="javascript:history.back()">Back</a></div>
        <p class="text-muted">Detailed payroll breakdown and statement generation.</p>
        <div class="row g-3" id="inputContainer">
            <div class="col-md-6"><label class="form-label fw-semibold">Payroll Reference ID</label><input class="form-control" id="payrollId" placeholder="payroll-id"></div>
            <div class="col-12"><button class="btn btn-primary" onclick="loadPayroll()">Load Detail</button></div>
        </div>
        <div id="result" class="mt-3"></div>
    </div></div>
</div>
<script>
async function loadPayroll(){
  const res = await fetch(`/api/v1/payroll/${document.getElementById('payrollId').value}`, { headers:{'Accept': 'application/json'}});
  const result = document.getElementById('result');
  if (!res.ok) { result.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Payslip details not found.</div>`; return; }
  const p = await res.json();
  result.innerHTML = `
    <div class="card mt-3 shadow-sm border">
      <div class="card-body">
        <h5 class="card-title fw-bold text-primary mb-3"><i class="fas fa-file-invoice-dollar"></i> Payslip Details</h5>
        <div class="row">
          <div class="col-md-6">
            <p class="mb-1"><strong>Employee:</strong> ${p.employeeFirstName||''} ${p.employeeLastName||''}</p>
            <p class="mb-1"><strong>Employee ID:</strong> ${p.employeeId||''}</p>
            <p class="mb-1"><strong>Period:</strong> ${p.month||''}/${p.year||''}</p>
          </div>
          <div class="col-md-6 text-md-end">
            <p class="mb-1"><strong>Gross Salary:</strong> $${p.grossSalary != null ? p.grossSalary.toFixed(2) : '0.00'}</p>
            <p class="mb-1"><strong>Deductions:</strong> $${p.deductions != null ? p.deductions.toFixed(2) : '0.00'}</p>
            <p class="mb-1"><strong>Overtime Worked:</strong> ${p.overtimeHours != null ? p.overtimeHours.toFixed(2) : '0.00'} hrs</p>
            <p class="mb-1"><strong>Overtime Pay:</strong> $${p.overtimePay != null ? p.overtimePay.toFixed(2) : '0.00'}</p>
            <h4 class="text-primary mt-2"><strong>Net Pay:</strong> $${p.netPay != null ? p.netPay.toFixed(2) : '0.00'}</h4>
          </div>
        </div>
        <hr class="my-3">
        <div class="d-flex justify-content-between align-items-center">
          <span class="badge ${p.status === 'PAID' ? 'bg-success' : 'bg-warning'}">${p.status||''}</span>
          <a href="/api/v1/payroll/${p.payrollId}/download" class="btn btn-danger">
            <i class="fas fa-file-pdf"></i> Download PDF Payslip
          </a>
        </div>
      </div>
    </div>`;
}

// Auto-load if UUID is in path
document.addEventListener('DOMContentLoaded', () => {
  const parts = window.location.pathname.split('/');
  const uuid = parts[parts.length - 1];
  if (uuid && uuid !== 'detail' && uuid.length > 10) {
    document.getElementById('payrollId').value = uuid;
    document.getElementById('inputContainer').style.display = 'none'; // hide manual input
    loadPayroll();
  }
});
</script>
</body>
</html>
