<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Request Leave</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
</head>
<body class="bg-light"><div class="container py-5" style="max-width: 900px;">
    <div class="card shadow-sm"><div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 mb-0">Request Leave</h1><a class="btn btn-outline-primary btn-sm" th:href="@{/employee/dashboard}">Back</a></div>
        <div id="msg"></div>
        <form id="leaveForm" class="row g-3">
            <div class="col-md-6"><label class="form-label">Employee ID</label><input class="form-control" id="employeeId" readonly></div>
            <div class="col-md-6"><label class="form-label">Leave Type</label><select class="form-select" id="type"><option>Sick</option><option>Casual</option><option>Annual</option></select></div>
            <div class="col-md-6"><label class="form-label">Start Date</label><input class="form-control" type="date" id="startDate" required></div>
            <div class="col-md-6"><label class="form-label">End Date</label><input class="form-control" type="date" id="endDate" required></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Submit</button></div>
        </form>
    </div></div>
</div>
<script>
fetch('/api/v1/auth/me', { headers: { 'Accept': 'application/json' } }).then(r => r.json()).then(d => document.getElementById('employeeId').value = d.employeeId || '');
document.getElementById('leaveForm').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch('/api/v1/leave', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      employeeId: document.getElementById('employeeId').value,
      startDate: document.getElementById('startDate').value,
      endDate: document.getElementById('endDate').value,
      type: document.getElementById('type').value
    })
  });
  document.getElementById('msg').innerHTML = res.ok ? '<div class="alert alert-success">Leave request submitted.</div>' : `<div class="alert alert-danger">${await res.text()}</div>`;
});
</script>
</body>
</html>
