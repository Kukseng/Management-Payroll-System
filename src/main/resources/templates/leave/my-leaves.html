<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Leaves</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
</head>
<body class="bg-light"><div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 mb-0">My Leave Requests</h1><a class="btn btn-outline-primary btn-sm" th:href="@{/employee/dashboard}">Back</a></div>
    <div class="card shadow-sm"><div class="card-body"><table class="table table-striped"><thead><tr><th>ID</th><th>Type</th><th>From</th><th>To</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div>
</div>
<script>
fetch('/api/v1/leave/my', { headers: { 'Accept': 'application/json' } }).then(r => r.json()).then(data => {
  const rows = document.getElementById('rows');
  rows.innerHTML = data.map(l => `<tr><td>${l.leaveRequestId||''}</td><td>${l.type||''}</td><td>${l.startDate||''}</td><td>${l.endDate||''}</td><td>${l.status||''}</td></tr>`).join('') || '<tr><td colspan="5">No records</td></tr>';
}).catch(()=>{
  document.getElementById('rows').innerHTML='<tr><td colspan="5">Failed to load</td></tr>';
});
</script>
</body>
</html>
