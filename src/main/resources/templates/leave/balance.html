<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leave Balance</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
</head>
<body class="bg-light"><div class="container py-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 mb-0">Leave Balance</h1><a class="btn btn-outline-primary btn-sm" th:href="@{/employee/dashboard}">Back</a></div>
    <div class="card shadow-sm"><div class="card-body p-4"><div id="msg"></div><div class="row g-3">
        <div class="col-md-6"><label class="form-label">Employee ID</label><input class="form-control" id="employeeId"></div>
        <div class="col-md-6 d-flex align-items-end"><button class="btn btn-primary" onclick="loadBalance()">Load</button></div>
    </div><div class="row g-3 mt-3" id="result"></div></div></div>
</div>
<script>
fetch('/api/v1/auth/me', { headers: { 'Accept': 'application/json' } }).then(r => r.json()).then(d => document.getElementById('employeeId').value = d.employeeId || '');
async function loadBalance(){
  const res = await fetch(`/api/v1/leave/balance/${document.getElementById('employeeId').value}`, { headers:{'Accept': 'application/json'}});
  const msg = document.getElementById('msg');
  if (!res.ok) { msg.innerHTML = `<div class="alert alert-danger">${await res.text()}</div>`; return; }
  const d = await res.json();
  const result = document.getElementById('result');
  result.innerHTML = `<div class="col-md-4"><div class="alert alert-info">Allowance: <strong>${d.annualAllowanceDays}</strong></div></div><div class="col-md-4"><div class="alert alert-warning">Approved: <strong>${d.approvedDays}</strong></div></div><div class="col-md-4"><div class="alert alert-success">Remaining: <strong>${d.remainingDays}</strong></div></div>`;
}
</script>
</body>
</html>
